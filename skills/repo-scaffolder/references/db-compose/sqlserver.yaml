# Microsoft SQL Server for local development.
# Credentials come from .env (never commit real values); see README.md.
# Start: docker compose -f sqlserver.yaml up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest # confirm the tag
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD} # must meet SQL Server complexity rules
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
volumes:
  mssqldata:
