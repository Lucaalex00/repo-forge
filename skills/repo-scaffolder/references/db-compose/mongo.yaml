# MongoDB for local development.
# Credentials come from .env (never commit real values); see README.md.
# Start: docker compose -f mongo.yaml up -d
services:
  mongo:
    image: mongo:7 # confirm the tag you want on Docker Hub
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
volumes:
  mongodata:
